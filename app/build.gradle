plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.xyz.clipcutter'
    compileSdk 35

    defaultConfig {
        applicationId "com.xyz.clipcutter"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // Unsigned/debug build is what GitHub Actions will produce.
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }
}

// The self-compiled FFmpegKit AAR is dropped into app/libs/ by the CI workflow
// (see .github/workflows/build.yml) before this module is built.
repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Self-compiled FFmpegKit (built from source in CI, arm64-v8a, MediaCodec H.264 enabled)
    implementation(name: 'ffmpeg-kit-release', ext: 'aar')
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'com.arthenica:smart-exception-java:0.2.1'
}
